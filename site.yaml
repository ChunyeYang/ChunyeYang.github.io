# Write your self-description below. Keep each line indented by two spaces.
bio:  Hi, I am Chunye Yang, a PhD. student at the University of Maryland, College Park. 
      My main interest is in number theory and arithmetic geometry. You can find some of my notes in the webpage and hope you enjoy them!

sections:
  Reading Notes:
    Etale Cohomology:
      description: Still updating, mosting following Lei Fu's book on etale cohomology. More detials of proof provided and some remarks and insights added. Test
      files:
        - title: Etale Cohomology/Preliminaries on field theory
        - title: Etale Cohomology/Preliminaries on Galois Theory
        - title: Etale Cohomology/Descent theory
        - title: Etale Cohomology/Etale and smooth morphisms
        - title: Etale Cohomology/Etale covering spaces
        - title: Etale Cohomology/Group cohomology and Galois cohomology

    FOAG Rising Sea: 
      description: Still updating, notes following Vakil's FOAG, mainly doing all the exercises and provide some of my own insight. A little bit messy in the beginning as topics are mixed together but the later parts are more clear and alligns with the sections on FOAG.
      files:
        - title: FOAG Rising Sea/Proj separatedness and properness
        - title: FOAG Rising Sea/Fibered product
        - title: FOAG Rising Sea/Quasi-coherent sheaves
        - title: FOAG Rising Sea/Dimension
        - title: FOAG Rising Sea/Regularity and smoothness
        - title: FOAG Rising Sea/Line bundles maps to projective spaces and divisors
        - title: FOAG Rising Sea/Maps to projective spaces and properties of line bundles
        - title: FOAG Rising Sea/Projective morphisms
        - title: FOAG Rising Sea/Cech cohomology of quasicoherent sheaves
        - title: FOAG Rising Sea/More on Cech cohomology of quasicoherent sheaves
        - title: FOAG Rising Sea/Curves
        - title: FOAG Rising Sea/Numerical intersection theory
        - title: FOAG Rising Sea/Sheaf of differentials
        - title: FOAG Rising Sea/Blow-up
        - title: FOAG Rising Sea/Spectral sequences and derived functors
        - title: FOAG Rising Sea/Flatness
        - title: FOAG Rising Sea/Miscellaneous

    Fourier Mukai Transforms: 
      description: Still updating, notes took during Summer 2025 Umich REU project on derived categroies and Fourier–Mukai Transforms. Following Huybrechts's book on Fourier-Mukai transforms in algebraic geometry.
      files:
        - title: Fourier Mukai Transforms/Triangulated categories
        - title: Fourier Mukai Transforms/Derived categroies
        - title: Fourier Mukai Transforms/Derived categories on coherent sheaves
        - title: Fourier Mukai Transforms/Derived category and canonical bundle part 1
        - title: Fourier Mukai Transforms/Fourier–Mukai transforms

    Complex Algebraic Geometry:
      description: >-
        Still updating. Course notes for the algebraic geometry class on compact Riemann surfaces
        offered at the University of Maryland in fall 2026. These notes can be read on their own
        with a solid background in one-variable complex analysis. Reading them alongside the
        FOAG notes may help illustrate the connections and differences between the two theories.
      files:
        - title: Compact Riemann Surface/Algebraic Geometry on Compact Riemann Surfaces Notes
        - title: Compact Riemann Surface/Write-up on Runge’s Theorem and the d-bar Equation

  Seminar Notes:
    Seminar on Elliptic Curves and Modular Forms:
      description: >-
        This will be the notes for the Seminar on Elliptic Curves and Modular Forms
        during the fall semester of 2026 at the University of Maryland. This seminar
        is an introductory level treatment on the topics of elliptic curves and
        modular forms, following Neal Koblitz's book Introduction to Modular Forms
        and elliptic curves.
      files:
        - title: Seminar on Elliptic Curves and Modular Forms/Seminar on Modular Forms and Elliptic Curves
        - title: Seminar on Elliptic Curves and Modular Forms/Write-up on Hasse Weil

  Research & Publications:
    Representation stability in the (co)homology of vertical configuration spaces: https://arxiv.org/abs/2412.01128
